name: FPUFieldSystem
options:
  bundleIdPrefix: com.watanabe.fpufieldsystem
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
targets:
  FPUFieldSystem:
    type: application
    platform: iOS
    sources:
      - path: FPUFieldSystem
    dependencies:
      - package: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.watanabe.fpufieldsystem
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        GENERATE_INFOPLIST_FILE: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: U4U4QK464J
  FPUFieldSystemMac:
    type: application
    platform: macOS
    sources:
      - path: FPUFieldSystem
    dependencies:
      - package: Supabase
    settings:
      base:
        PRODUCT_NAME: FPUFieldSystem
        PRODUCT_BUNDLE_IDENTIFIER: com.watanabe.fpufieldsystem.mac
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ENABLE_HARDENED_RUNTIME: "YES"
        COMBINE_HIDPI_IMAGES: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: U4U4QK464J
